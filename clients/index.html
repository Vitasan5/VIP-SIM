<!doctype html>

<html lang="ru">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="robots" content="noindex, nofollow, noarchive" />

    <title>Сервис клиентов</title>

    <style>
      :root {
        --bg: #f4f6fa;

        --surface: #ffffff;

        --surface-soft: #f8fafc;

        --border: #e5e7eb;

        --text: #111827;

        --muted: #6b7280;

        --primary: #2563eb;

        --primary-dark: #1d4ed8;

        --danger: #dc2626;

        --danger-dark: #b91c1c;

        --success: #16a34a;

        --shadow: 0 10px 30px rgba(15, 23, 42, 0.07);

        --radius: 18px;
      }

       * {
        box-sizing: border-box;
      }

      body {
        margin: 0;

        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
           -apple-system ,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;

        background: var(--bg);

        color: var(--text);
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        border: 0;

        cursor: pointer;
      }

      .app {
        width: min(1180px, calc(100% - 32px));

        margin: 0 auto;

        padding: 28px 0 48px;
      }

      .login-card {
        width: min(420px, 100%);

        margin: 10vh auto 0;

        padding: 32px;

        background: var(--surface);

        border: 1px solid var(--border);

        border-radius: 24px;

        box-shadow: var(--shadow);
      }

      .brand {
        margin-bottom: 24px;
      }

      .brand h1 {
        margin: 0 0 8px;

        font-size: 30px;

        letter-spacing: -0.03em;
      }

      .brand p {
        margin: 0;

        color: var(--muted);

        line-height: 1.5;
      }

      .field {
        margin-bottom: 14px;
      }

      .field label {
        display: block;

        margin: 0 0 7px;

        font-size: 13px;

        font-weight: 650;

        color: #374151;
      }

      input,
      select,
      textarea {
        width: 100%;

        padding: 12px 14px;

        border: 1px solid var(--border);

        border-radius: 12px;

        background: #fff;

        color: var(--text);

        outline: none;

        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }

      input:focus,
      select:focus,
      textarea:focus {
        border-color: #93c5fd;

        box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
      }

      textarea {
        min-height: 96px;

        resize: vertical;
      }

      .button {
        display: inline-flex;

        align-items: center;

        justify-content: center;

        gap: 7px;

        min-height: 42px;

        padding: 10px 15px;

        border-radius: 11px;

        background: var(--primary);

        color: #fff;

        font-weight: 650;

        transition:
          background 0.15s,
          transform 0.05s;
      }

      .button:hover {
        background: var(--primary-dark);
      }

      .button:active {
        transform: translateY(1px);
      }

      .button.secondary {
        background: #eef2f7;

        color: #374151;
      }

      .button.secondary:hover {
        background: #e5e7eb;
      }

      .button.danger {
        background: var(--danger);
      }

      .button.danger:hover {
        background: var(--danger-dark);
      }

      .button.ghost {
        background: transparent;

        color: #4b5563;
      }

      .button.ghost:hover {
        background: #f3f4f6;
      }

      .button.small {
        min-height: 36px;

        padding: 8px 11px;

        font-size: 13px;
      }

      .button.full {
        width: 100%;
      }

      .error {
        margin-top: 12px;

        color: var(--danger);

        font-size: 14px;
      }

      .topbar {
        display: flex;

        align-items: center;

        justify-content: space-between;

        gap: 16px;

        margin-bottom: 22px;
      }

      .topbar-title {
        cursor: pointer;
      }

      .topbar-title h1 {
        margin: 0;

        font-size: 28px;

        letter-spacing: -0.03em;
      }

      .topbar-title p {
        margin: 4px 0 0;

        color: var(--muted);

        font-size: 14px;
      }

      .topbar-actions {
        display: flex;

        gap: 8px;

        flex-wrap: wrap;

        justify-content: flex-end;
      }

      .toolbar {
        display: grid;

        grid-template-columns: minmax(220px, 1.5fr) repeat(
            3,
            minmax(150px, 1fr)
          );

        gap: 10px;

        margin-bottom: 18px;
      }

      .toolbar input,
      .toolbar select {
        background: var(--surface);
      }

      .panel {
        background: var(--surface);

        border: 1px solid var(--border);

        border-radius: var(--radius);

        box-shadow: var(--shadow);

        padding: 20px;

        margin-bottom: 18px;
      }

      .panel-head {
        display: flex;

        align-items: center;

        justify-content: space-between;

        gap: 12px;

        margin-bottom: 16px;
      }

      .panel-head h2,
      .panel-head h3 {
        margin: 0;

        letter-spacing: -0.02em;
      }

      .panel-head p {
        margin: 4px 0 0;

        color: var(--muted);

        font-size: 14px;
      }

      .cards {
        display: grid;

        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));

        gap: 16px;
      }

      .client-card {
        display: flex;

        flex-direction: column;

        min-height: 270px;

        padding: 20px;

        background: var(--surface);

        border: 1px solid var(--border);

        border-radius: var(--radius);

        box-shadow: 0 6px 20px rgba(15, 23, 42, 0.045);
      }

      .client-card h2 {
        margin: 0 0 14px;

        font-size: 20px;

        letter-spacing: -0.02em;
      }

      .info {
        margin: 0 0 12px;
      }

      .label {
        margin-bottom: 3px;

        color: var(--muted);

        font-size: 12px;

        font-weight: 600;
      }

      .value {
        line-height: 1.45;

        overflow-wrap: anywhere;
      }

      .client-card .button {
        margin-top: auto;

        width: 100%;
      }

      .empty {
        padding: 42px 20px;

        text-align: center;

        color: var(--muted);

        background: var(--surface);

        border: 1px dashed var(--border);

        border-radius: var(--radius);
      }

      .form-grid {
        display: grid;

        grid-template-columns: repeat(2, minmax(0, 1fr));

        gap: 14px;
      }

      .form-grid .full-width {
        grid-column: 1 / -1;
      }

      .form-actions {
        display: flex;

        gap: 8px;

        flex-wrap: wrap;

        margin-top: 4px;
      }

      .detail-card {
        background: var(--surface);

        border: 1px solid var(--border);

        border-radius: var(--radius);

        box-shadow: var(--shadow);

        padding: 24px;
      }

      .back-button {
        margin-bottom: 18px;
      }

      .detail-header {
        display: flex;

        justify-content: space-between;

        gap: 16px;

        align-items: flex-start;

        margin-bottom: 20px;
      }

      .detail-header h2 {
        margin: 0 0 7px;

        font-size: 28px;

        letter-spacing: -0.03em;
      }

      .detail-header p {
        margin: 0;

        color: var(--muted);
      }

      .detail-actions {
        display: flex;

        gap: 8px;

        flex-wrap: wrap;

        justify-content: flex-end;
      }

      .subsection {
        margin-top: 28px;

        padding-top: 24px;

        border-top: 1px solid var(--border);
      }

      .interaction {
        padding: 18px;

        margin-top: 12px;

        background: var(--surface-soft);

        border: 1px solid var(--border);

        border-radius: 14px;
      }

      .interaction-head {
        display: flex;

        justify-content: space-between;

        align-items: center;

        gap: 10px;

        margin-bottom: 12px;
      }

      .interaction-title {
        font-weight: 700;
      }

      .badge {
        display: inline-flex;

        align-items: center;

        padding: 5px 9px;

        border-radius: 999px;

        background: #eff6ff;

        color: #1d4ed8;

        font-size: 12px;

        font-weight: 700;
      }

      .link-row {
        display: flex;

        flex-wrap: wrap;

        gap: 8px;

        margin-top: 12px;
      }

      .settings-nav {
        display: flex;

        gap: 8px;

        flex-wrap: wrap;

        margin-bottom: 18px;
      }

      .settings-tab {
        min-height: 40px;

        padding: 9px 13px;

        border-radius: 10px;

        background: #eef2f7;

        color: #4b5563;

        font-weight: 650;
      }

      .settings-tab.active {
        background: #dbeafe;

        color: #1d4ed8;
      }

      .toolbar-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 10px;
      }

      .topic-tag-wrap {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin-top: 5px;
      }

      .topic-tag {
        display: inline-flex;
        align-items: center;
        width: fit-content;
        max-width: 100%;
        padding: 5px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        line-height: 1.2;
        border: 1px solid rgba(15, 23, 42, 0.08);
        overflow-wrap: anywhere;
      }

      .topic-color-input {
        width: 38px;
        height: 32px;
        padding: 2px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #fff;
        cursor: pointer;
        flex-shrink: 0;
      }

      .setting-topic {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .client-meta-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin: -4px 0 14px;
      }

      .rating {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: #92400e;
        font-size: 13px;
        font-weight: 700;
      }

      .interaction-date {
        color: var(--muted);
        font-size: 13px;
        font-weight: 600;
      }

      .copy-status {
        margin-top: 8px;
        color: var(--success);
        font-size: 13px;
        font-weight: 600;
      }

      .setting-list {
        display: grid;

        gap: 9px;
      }

      .setting-item {
        display: flex;

        align-items: center;

        justify-content: space-between;

        gap: 12px;

        padding: 12px 14px;

        border: 1px solid var(--border);

        border-radius: 12px;

        background: #fff;
      }

      .setting-name {
        font-weight: 600;

        overflow-wrap: anywhere;
      }

      .setting-actions {
        display: flex;

        gap: 6px;

        flex-shrink: 0;
      }

      .muted {
        color: var(--muted);

        font-size: 14px;
      }

      .hidden {
        display: none !important;
      }

      @media (max-width: 820px) {
        .toolbar {
          grid-template-columns: 1fr 1fr;
        }
      }

      @media (max-width: 600px) {
        .app {
          width: min(100% - 20px, 1180px);

          padding: 16px 0 30px;
        }

        .login-card {
          margin-top: 5vh;

          padding: 22px;

          border-radius: 18px;
        }

        .topbar {
          align-items: flex-start;

          flex-direction: column;
        }

        .topbar-actions {
          width: 100%;

          display: grid;

          grid-template-columns: 1fr 1fr;
        }

        .topbar-actions .button {
          width: 100%;
        }

        .toolbar {
          grid-template-columns: 1fr;
        }

        .cards {
          grid-template-columns: 1fr;
        }

        .form-grid {
          grid-template-columns: 1fr;
        }

        .form-grid .full-width {
          grid-column: auto;
        }

        .detail-card,
        .panel {
          padding: 16px;
        }

        .detail-header {
          flex-direction: column;
        }

        .detail-actions {
          width: 100%;
        }

        .detail-actions .button {
          width: 100%;
        }

        .setting-item {
          align-items: flex-start;

          flex-direction: column;
        }

        .setting-actions {
          width: 100%;
        }

        .setting-actions .button {
          flex: 1;
        }

        .form-actions .button {
          width: 100%;
        }
      }
    </style>
  </head>

  <body>
    <div class="app">
      <!-- LOGIN -->

      <div id="login" class="login-card">
        <div class="brand">
          <h1>Сервис клиентов</h1>

          <p>Ваше рабочее пространство для клиентов и обращений.</p>
        </div>

        <div class="field">
          <label for="email">Email</label>

          <input
            id="email"
            type="email"
            placeholder="you@example.com"
            autocomplete="email"
          />
        </div>

        <div class="field">
          <label for="password">Пароль</label>

          <input
            id="password"
            type="password"
            placeholder="Введите пароль"
            autocomplete="current-password"
          />
        </div>

        <button id="loginButton" class="button full">Войти</button>

        <div id="loginError" class="error"></div>
      </div>

      <!-- APP -->

      <div id="app" class="hidden">
        <header class="topbar">
          <div class="topbar-title" onclick="showClientsList()">
            <h1>Клиенты</h1>

            <p>Клиентская база и история обращений</p>
          </div>

          <div class="topbar-actions">
            <button class="button secondary" onclick="showSettings()">
              ⚙ Настройки
            </button>

            <button class="button secondary" onclick="logout()">Выйти</button>
          </div>
        </header>

        <!-- CLIENT LIST -->

        <div id="clientsPage">
          <div class="panel">
            <div class="panel-head">
              <div>
                <h2>Клиенты</h2>

                <p>Ищите клиентов и фильтруйте обращения.</p>
              </div>

              <button class="button" onclick="showAddClientForm()">
                + Добавить клиента
              </button>
            </div>

            <div id="addClientForm" class="hidden">
              <div class="form-grid">
                <div class="field">
                  <label for="newClientName">Имя</label>

                  <input id="newClientName" placeholder="Имя клиента" />
                </div>

                <div class="field">
                  <label for="newClientPhone">Телефон</label>

                  <input id="newClientPhone" placeholder="+7 ..." />
                </div>

                <div class="field">
                  <label for="newClientEmail">Email</label>

                  <input
                    id="newClientEmail"
                    type="email"
                    placeholder="email@example.com"
                  />
                </div>

                <div class="field full-width">
                  <label for="newClientComment">Комментарий</label>

                  <textarea
                    id="newClientComment"
                    placeholder="Короткая заметка о клиенте"
                  ></textarea>
                </div>
              </div>

              <div class="form-actions">
                <button class="button" onclick="addClient()">
                  Сохранить клиента
                </button>

                <button class="button secondary" onclick="hideAddClientForm()">
                  Отмена
                </button>
              </div>
            </div>

            <div class="toolbar">
              <input
                id="search"
                placeholder="Поиск по имени, телефону или email"
              />

              <select id="sourceFilter">
                <option value="">Все источники</option>
              </select>

              <select id="topicFilter">
                <option value="">Все темы</option>
              </select>

              <select id="resultFilter">
                <option value="">Все результаты</option>
              </select>
            </div>

            <div class="toolbar-actions">
              <button
                class="button secondary small"
                onclick="downloadClientsCsv()"
              >
                ⬇ Скачать список
              </button>

              <button class="button ghost small" onclick="resetFilters()">
                Сбросить фильтры
              </button>
            </div>
          </div>

          <div id="cards" class="cards">
            <div class="empty">Загрузка клиентов...</div>
          </div>
        </div>

        <!-- CLIENT DETAILS -->

        <div id="clientDetails" class="hidden"></div>

        <!-- SETTINGS -->

        <div id="settings" class="hidden">
          <div class="panel">
            <div class="panel-head">
              <div>
                <h2>Настройки</h2>

                <p>Настройте свои источники, темы и результаты обращений.</p>
              </div>

              <button class="button secondary" onclick="showClientsList()">
                ← К клиентам
              </button>
            </div>

            <div class="settings-nav">
              <button
                id="settingsTabSources"
                class="settings-tab active"
                onclick="showSettingsTab('sources')"
              >
                Источники
              </button>

              <button
                id="settingsTabTopics"
                class="settings-tab"
                onclick="showSettingsTab('topics')"
              >
                Темы
              </button>

              <button
                id="settingsTabResults"
                class="settings-tab"
                onclick="showSettingsTab('results')"
              >
                Результаты
              </button>
            </div>

            <div id="settingsSources"></div>

            <div id="settingsTopics" class="hidden"></div>

            <div id="settingsResults" class="hidden"></div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
      const SUPABASE_URL = "https://cgmafprlztqagnzffzgs.supabase.co";

      const SUPABASE_KEY = "sb_publishable_2Swng6qIYXp57nTSqjYVdA_wb16gSE5";

      const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,

        SUPABASE_KEY,
      );

      const cards = document.getElementById("cards");

      const search = document.getElementById("search");

      let clients = [];

      let settingsData = { sources: [], topics: [], results: [] };

      function normalizeText(value) {
        return String(value || "")
          .trim()
          .replace(/\s+/g, " ")
          .toLowerCase();
      }

      function normalizePhone(value) {
        return String(value || "").replace(/\D/g, "");
      }

      function formatDate(value) {
        if (!value) return "—";

        const date = new Date(value);

        if (Number.isNaN(date.getTime())) return "—";

        return date.toLocaleString("ru-RU", {
          day: "2-digit",
          month: "2-digit",
          year: "numeric",

          hour: "2-digit",
          minute: "2-digit",
        });
      }

      function sortInteractions(interactions) {
        return [...(interactions || [])].sort(
          (a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0),
        );
      }

      function getLastInteraction(client) {
        return sortInteractions(client.interactions || [])[0] || null;
      }

      function pluralize(number, one, few, many) {
        const n = Math.abs(number) % 100;

        const n1 = n % 10;

        if (n > 10 && n < 20) return many;

        if (n1 === 1) return one;

        if (n1 >= 2 && n1 <= 4) return few;

        return many;
      }

      function renderRating(count) {
        if (!count) return '<span class="rating">☆ Нет обращений</span>';

        const stars = "★".repeat(Math.min(count, 5));

        const suffix = count > 5 ? "+" : "";

        return `<span class="rating">${stars}${suffix} · ${count} ${pluralize(count, "обращение", "обращения", "обращений")}</span>`;
      }

      const TOPIC_COLORS = [
        "#dbeafe",
        "#dcfce7",
        "#fef3c7",
        "#fce7f3",
        "#ede9fe",
        "#cffafe",
        "#ffedd5",
        "#e0e7ff",
        "#d1fae5",
        "#fee2e2",
        "#f3e8ff",
        "#ccfbf1",
      ];

      function getAutoTopicColor(topicName) {
        const topics = settingsData.topics || [];
        const index = topics.findIndex((item) => item.name === topicName);
        return TOPIC_COLORS[(index >= 0 ? index : 0) % TOPIC_COLORS.length];
      }

      function getTopicColor(topicName) {
        const topic = (settingsData.topics || []).find(
          (item) => item.name === topicName,
        );
        const savedColor = topic?.color;
        if (!savedColor || savedColor.toLowerCase() === "#dbeafe")
          return getAutoTopicColor(topicName);
        return savedColor;
      }

      function hexToRgb(hex) {
        const clean = String(hex || "").replace("#", "");

        if (!/^[0-9a-fA-F]{6}$/.test(clean)) return null;

        const value = parseInt(clean, 16);

        return {
          r: (value >> 16) & 255,
          g: (value >> 8) & 255,
          b: value & 255,
        };
      }

      function getTopicTextColor(hex) {
        const rgb = hexToRgb(hex);

        if (!rgb) return "#1e3a8a";

        const luminance = (0.299 * rgb.r + 0.587 * rgb.g + 0.114 * rgb.b) / 255;

        return luminance > 0.72 ? "#1f2937" : "#ffffff";
      }

      function renderTopicTag(topicName, color) {
        const name = topicName || "—";

        const background =
          !color || color.toLowerCase() === "#dbeafe"
            ? getTopicColor(topicName)
            : color;

        return `<span class="topic-tag" style="background:${escapeAttr(background)};color:${escapeAttr(getTopicTextColor(background))};">${escapeHtml(name)}</span>`;
      }

      async function loadClients() {
        cards.innerHTML = '<div class="empty">Загружаем клиентов...</div>';

        const { data, error } = await supabaseClient

          .from("clients")

          .select(
            `*, interactions (id, source, topic, result, comment, created_at)`,
          )

          .order("created_at", { ascending: false });

        if (error) {
          console.error("Ошибка Supabase:", error);

          cards.innerHTML =
            '<div class="empty">Не удалось загрузить клиентов.</div>';

          return;
        }

        clients = (data || []).map((client) => ({
          ...client,

          interactions: sortInteractions(client.interactions || []),
        }));

        renderClients(clients);
      }

      function renderClients(list) {
        if (!list.length) {
          cards.innerHTML = '<div class="empty">Клиенты не найдены.</div>';

          return;
        }

        cards.innerHTML = list
          .map((client) => {
            const last = getLastInteraction(client);

            const count = (client.interactions || []).length;

            return `

            <article class="client-card">

              <h2>${escapeHtml(client.name || "Без имени")}</h2>

              <div class="client-meta-row">${renderRating(count)}</div>

              <div class="info"><div class="label">Телефон</div><div class="value">${escapeHtml(client.phone || "—")}</div></div>

              <div class="info"><div class="label">Email</div><div class="value">${escapeHtml(client.email || "—")}</div></div>

              ${
                last
                  ? `

                <div class="info">

                  <div class="label">Последнее обращение</div>

                  <div class="value">

      function getFilteredClients() {
        const query = search.value.trim().toLowerCase();

        const source = document.getElementById("sourceFilter").value;

        const topic = document.getElementById("topicFilter").value;

        const result = document.getElementById("resultFilter").value;

        return clients.filter((client) => {
          const matchesSearch =
            (client.name || "").toLowerCase().includes(query) ||
            (client.phone || "").toLowerCase().includes(query) ||
            (client.email || "").toLowerCase().includes(query);

          const matchesSource =
            !source ||
            (client.interactions || []).some((i) => i.source === source);

          const matchesTopic =
            !topic ||
            (client.interactions || []).some((i) => i.topic === topic);

          const matchesResult =
            !result ||
            (client.interactions || []).some((i) => i.result === result);

          return (
            matchesSearch && matchesSource && matchesTopic && matchesResult
          );
        });
      }

        renderClients(getFilteredClients());

      async function addInteraction(clientId) {
        const source = document
          .getElementById("interactionSource")
          .value.trim();

        const topic = document.getElementById("interactionTopic").value.trim();

        const result = document
          .getElementById("interactionResult")
          .value.trim();

        const comment = document
          .getElementById("interactionComment")
          .value.trim();

        const rawUrl = document.getElementById("interactionUrl").value.trim();

        if (!source || !topic || !result) {
          alert("Заполни источник, тему и результат.");
          return;
        }

        let url = "";

        if (rawUrl) {
          url = normalizeUrl(rawUrl);

          if (!url) {
            alert("Проверь ссылку на переписку. Например: https://t.me/...");
            return;
          }
        }

        const { data: interaction, error } = await supabaseClient
          .from("interactions")
          .insert({
            client_id: clientId,
            source,
            topic,
            result,
            comment,
          })
          .select()
          .single();

        if (error) {
          console.error("Ошибка добавления обращения:", error);
          alert("Не удалось добавить обращение.");
          return;
        }

        if (url) {
          const { error: linkError } = await supabaseClient
            .from("contact_links")
            .insert({
              client_id: clientId,
              interaction_id: interaction.id,
              service: source,
              url,
            });

          if (linkError) {
            console.error("Ошибка добавления ссылки:", linkError);

            alert("Обращение добавлено, но ссылку сохранить не удалось.");
          }
        }

        await loadClients();

        await openClient(clientId);
      }

      function findDuplicateClient(candidate, excludeId = "") {
        const name = normalizeText(candidate.name);

        const phone = normalizePhone(candidate.phone);

        const email = normalizeText(candidate.email);

        return clients.find((client) => {
          if (excludeId && client.id === excludeId) return false;

          const sameName = Boolean(name && normalizeText(client.name) === name);

          const existingPhone = normalizePhone(client.phone);

          const samePhone = Boolean(
            phone && existingPhone && existingPhone === phone,
          );

          const sameEmail = Boolean(
            email && normalizeText(client.email) === email,
          );

          return sameName || samePhone || sameEmail;
        });
      }

      function getDuplicateMessage(duplicate) {
        return `Похоже, клиент «${duplicate.name || "Без имени"}» уже есть в базе. Совпало имя, телефон или email.`;
      }

      async function saveClientChanges() {
        const clientId = document.getElementById("editClientId").value;

        const name = document.getElementById("editClientName").value.trim();

        const phone = document.getElementById("editClientPhone").value.trim();

        const email = document.getElementById("editClientEmail").value.trim();

        const comment = document
          .getElementById("editClientComment")
          .value.trim();

        if (!name) {
          alert("Имя клиента не может быть пустым.");
          return;
        }

        const duplicate = findDuplicateClient({ name, phone, email }, clientId);

        if (duplicate) {
          alert(getDuplicateMessage(duplicate));
          return;
        }

        const { error } = await supabaseClient
          .from("clients")
          .update({ name, phone, email, comment })
          .eq("id", clientId);

        if (error) {
          console.error("Ошибка изменения клиента:", error);
          alert("Не удалось сохранить изменения.");
          return;
        }

        await loadClients();

        await openClient(clientId);
      }

      async function addClient() {
        const name = document.getElementById("newClientName").value.trim();

        const phone = document.getElementById("newClientPhone").value.trim();

        const email = document.getElementById("newClientEmail").value.trim();

        const comment = document
          .getElementById("newClientComment")
          .value.trim();

        if (!name) {
          alert("Имя клиента не может быть пустым.");
          return;
        }

        const {
          data: { user },
        } = await supabaseClient.auth.getUser();

        if (!user) {
          alert("Необходимо войти в систему.");
          return;
        }

        const duplicate = findDuplicateClient({ name, phone, email });

        if (duplicate) {
          const shouldOpen = confirm(
            getDuplicateMessage(duplicate) +
              "\n\nОткрыть существующего клиента?",
          );

          if (shouldOpen) await openClient(duplicate.id);

          return;
        }

        const { error } = await supabaseClient
          .from("clients")
          .insert({ owner_id: user.id, name, phone, email, comment });

        if (error) {
          console.error("Ошибка добавления клиента:", error);
          alert("Не удалось добавить клиента.");
          return;
        }

        [
          "newClientName",
          "newClientPhone",
          "newClientEmail",
          "newClientComment",
        ].forEach((id) => {
          document.getElementById(id).value = "";
        });

        hideAddClientForm();

        await loadClients();
      }

      async function deleteClient(clientId) {
        if (!confirm("Удалить этого клиента и всю историю его обращений?"))
          return;

        const { error } = await supabaseClient
          .from("clients")
          .delete()
          .eq("id", clientId);

        if (error) {
          console.error("Ошибка удаления клиента:", error);

        await loadClients();

        showClientsList();

          .delete()
          .eq("id", interactionId);

        if (error) {
          console.error("Ошибка удаления обращения:", error);

      async function showSettings() {

      function showSettingsTab(tab) {
        const tabs = {
          sources: ["settingsSources", "settingsTabSources"],

          topics: ["settingsTopics", "settingsTabTopics"],

          results: ["settingsResults", "settingsTabResults"],
        };

        Object.entries(tabs).forEach(([key, [containerId, buttonId]]) => {
          document
            .getElementById(containerId)
            .classList.toggle("hidden", key !== tab);

          document
            .getElementById(buttonId)
            .classList.toggle("active", key === tab);
        });
      }

      async function loadSettingsData() {
        const [sources, topics, results] = await Promise.all([
          loadSettingTable("sources"),
          loadSettingTable("topics"),
          loadSettingTable("results"),
        ]);

        settingsData.sources = sources;

        settingsData.topics = topics;

        settingsData.results = results;

        renderSettings("sources");

        renderSettings("topics");

        renderSettings("results");

        populateFilterSelects();
      }

      async function loadSettingTable(tableName) {
        const { data, error } = await supabaseClient
          .from(tableName)
          .select("*")
          .order("created_at", { ascending: true });

        if (error) {
          console.error(`Ошибка загрузки ${tableName}:`, error);
          return [];
        }

        return data || [];
      }

      async function addSetting(type) {
        const inputIds = {
          sources: "newSourceName",
          topics: "newTopicName",
          results: "newResultName",
        };

        const name = document.getElementById(inputIds[type]).value.trim();

        if (!name) {
          alert("Введите название.");
          return;
        }

        const {
          data: { user },
        } = await supabaseClient.auth.getUser();

        if (!user) {
          alert("Необходимо войти в систему.");
          return;
        }

        const duplicate = (settingsData[type] || []).find(
          (item) => normalizeText(item.name) === normalizeText(name),
        );

        if (duplicate) {
          alert(`«${name}» уже есть в этом списке.`);
          return;
        }

        const insertData = { owner_id: user.id, name };

        if (type === "topics") {
          insertData.color =
            TOPIC_COLORS[
              (settingsData.topics || []).length % TOPIC_COLORS.length
            ];
        }

        const { error } = await supabaseClient.from(type).insert(insertData);

        if (error) {
          console.error(`Ошибка добавления ${type}:`, error);
          alert("Не удалось сохранить.");
          return;
        }

        await loadSettingsData();
      }

      async function editSetting(type, id) {
        const current = (settingsData[type] || []).find(
          (item) => item.id === id,
        );

        if (!current) return;

        const name = prompt("Новое название:", current.name);

        if (name === null) return;

        const cleanName = name.trim();

        if (!cleanName) {
          alert("Название не может быть пустым.");
          return;
        }

        const duplicate = (settingsData[type] || []).find(
          (item) =>
            item.id !== id &&
            normalizeText(item.name) === normalizeText(cleanName),
        );

        if (duplicate) {
          alert(`«${cleanName}» уже есть в этом списке.`);
          return;
        }

        const { error } = await supabaseClient
          .from(type)
          .update({ name: cleanName })
          .eq("id", id);

        if (error) {
          console.error(`Ошибка изменения ${type}:`, error);
          alert("Не удалось изменить.");
          return;
        }

        await loadSettingsData();
      }

          .from("topics")

          .eq("id", id);

          console.error("Ошибка изменения цвета темы:", error);

          await loadSettingsData();

        if (!current) return;

        if (!confirm(`Удалить «${current.name}»?`)) return;

        const { error } = await supabaseClient.from(type).delete().eq("id", id);

        if (error) {
          console.error(`Ошибка удаления ${type}:`, error);
          alert("Не удалось удалить.");

      function populateFilterSelects() {
        fillSelect(
          document.getElementById("sourceFilter"),
          settingsData.sources,
          "Все источники",
        );

        fillSelect(
          document.getElementById("topicFilter"),
          settingsData.topics,
          "Все темы",
        );

        fillSelect(
          document.getElementById("resultFilter"),
          settingsData.results,
          "Все результаты",
        );
      }

      function populateInteractionSelects() {
        const source = document.getElementById("interactionSource");

        const topic = document.getElementById("interactionTopic");

        const result = document.getElementById("interactionResult");

        if (!source || !topic || !result) return;

        fillSelect(source, settingsData.sources, "Выберите источник");

        fillSelect(topic, settingsData.topics, "Выберите тему");

        fillSelect(result, settingsData.results, "Выберите результат");
      }

      function fillSelect(select, items, placeholder) {
        if (!select) return;

        select.innerHTML = "";

        const first = document.createElement("option");

        first.value = "";

        first.textContent = placeholder;

        select.appendChild(first);

        (items || []).forEach((item) => {
          const option = document.createElement("option");

          option.value = item.name;

          option.textContent = item.name;

          select.appendChild(option);
        });
      }

      function normalizeUrl(value) {
        let url = String(value || "").trim();

        if (!url) return "";

        url = url.replace(/\s+/g, "");

        url = url.replace(/^https?:\/\//i, (match) => match.toLowerCase());

        url = url.replace(
          /^https?:\/([^/])/i,
          (match, first) =>
            (match.toLowerCase().startsWith("https") ? "https://" : "http://") +
            first,
        );

        if (/^(t\.me|wa\.me|www\.)/i.test(url)) url = "https://" + url;

        if (!/^https?:\/\//i.test(url)) url = "https://" + url;

        try {
          const parsed = new URL(url);

          if (!/^https?:$/.test(parsed.protocol)) return "";

          return parsed.href;
        } catch {
          return "";
        }
      }

      async function copyClientText(clientId) {
        const client = clients.find((item) => item.id === clientId);

        if (!client) return;

        const interactions = sortInteractions(client.interactions || []);

        const last = interactions[0];

        const text = [
          `Имя: ${client.name || "—"}`,

          `Контакты: ${client.phone || client.email || "—"}`,

          `Телефон: ${client.phone || "—"}`,

          `Email: ${client.email || "—"}`,

          `Количество обращений: ${interactions.length}`,

          `Последнее обращение: ${last ? formatDate(last.created_at) : "—"}`,

          `Источник: ${last?.source || "—"}`,

          `Тема: ${last?.topic || "—"}`,

          `Результат: ${last?.result || "—"}`,

          `Комментарий: ${client.comment || "—"}`,
        ].join("; ");

        try {
          await navigator.clipboard.writeText(text);
        } catch {
          const textarea = document.createElement("textarea");

          textarea.value = text;

          textarea.style.position = "fixed";

          textarea.style.opacity = "0";

          document.body.appendChild(textarea);

          textarea.focus();
          textarea.select();

          document.execCommand("copy");

          textarea.remove();
        }

        const status = document.getElementById("copyStatus");

        if (status) {
          status.textContent = "Данные клиента скопированы в буфер обмена.";

          status.classList.remove("hidden");

          setTimeout(() => status.classList.add("hidden"), 2500);
        }
      }

      function csvEscape(value) {
        const text = String(value ?? "");

        return `"${text.replaceAll('"', '""')}"`;
      }

      function downloadClientsCsv() {
        const list = getFilteredClients();

        if (!list.length) {
          alert("Нет клиентов для скачивания по текущим условиям.");
          return;
        }

        const headers = [
          "Имя",
          "Телефон",
          "Email",
          "Количество обращений",
          "Дата последнего обращения",
          "Последний источник",
          "Последняя тема",
          "Последний результат",
          "Комментарий",
        ];

        const rows = list.map((client) => {
          const last = getLastInteraction(client);

          return [
            client.name || "",
            client.phone || "",
            client.email || "",
            (client.interactions || []).length,
            last ? formatDate(last.created_at) : "",
            last?.source || "",
            last?.topic || "",
            last?.result || "",
            client.comment || "",
          ];
        });

        const csv = [headers, ...rows]
          .map((row) => row.map(csvEscape).join(";"))
          .join("\r\n");

        const blob = new Blob(["\ufeff" + csv], {
          type: "text/csv;charset=utf-8;",
        });

        const url = URL.createObjectURL(blob);

        const link = document.createElement("a");

        link.href = url;

        link.download = `clients-${new Date().toISOString().slice(0, 10)}.csv`;

        document.body.appendChild(link);

        link.click();

        link.remove();

        URL.revokeObjectURL(url);
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function escapeAttr(value) {
        return escapeHtml(value);
      }

      async function logout() {
        const { error } = await supabaseClient.auth.signOut();

        if (error) {
          console.error("Ошибка выхода:", error);
          alert("Не удалось выйти.");
          return;
        }

        document.getElementById("app").classList.add("hidden");

        document.getElementById("login").classList.remove("hidden");
      }
    </script>

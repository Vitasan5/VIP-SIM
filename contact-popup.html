<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Свяжитесь с нами</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .popup-content {
            background: white;
            border-radius: 12px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        .contact-menu {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 25px 0;
            flex-wrap: wrap;
        }
        
        .contact-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #f8f9fa;
            transition: all 0.3s ease;
        }
        
        .contact-link:hover {
            transform: translateY(-3px);
        }
        
        .contact-icon {
            width: 24px;
            height: 24px;
        }
        
        h2 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        
        p {
            color: #7f8c8d;
            margin-bottom: 20px;
        }
        
        .close-btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
        }
        
        .close-btn:hover {
            background: #2980b9;
        }
    </style>
</head>
<body>
    <div class="popup-content">
        <h2>Свяжитесь с нами</h2>
        <p>Выберите удобный способ связи</p>
        
        <div class="contact-menu">
            <a href="https://wa.me/79915556663" target="_blank" title="WhatsApp" class="contact-link">
                <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp" class="contact-icon">
            </a>
            <a href="https://t.me/vipsimka82" target="_blank" title="Telegram" class="contact-link">
                <img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" alt="Telegram" class="contact-icon">
            </a>
            <a href="mailto:vip.simki@vk.com" title="Email" class="contact-link">
                <img src="https://upload.wikimedia.org/wikipedia/commons/4/4e/Gmail_Icon.png" alt="Email" class="contact-icon">
            </a>
            <a href="https://instagram.com/_vipsimka" target="_blank" title="Instagram" class="contact-link">
                <img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" alt="Instagram" class="contact-icon">
            </a>
            <a href="https://facebook.com/vitalij.san.658372" target="_blank" title="Facebook" class="contact-link">
                <img src="https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_(2019).svg" alt="Facebook" class="contact-icon">
            </a>
            <a href="https://vk.com/vip.simki" target="_blank" title="VK" class="contact-link">
                <img src="https://upload.wikimedia.org/wikipedia/commons/2/21/VK.com-logo.svg" alt="VK" class="contact-icon">
            </a>
        </div>
        
        <button class="close-btn" onclick="window.close()">Закрыть</button>
    </div>
</body>
</html>

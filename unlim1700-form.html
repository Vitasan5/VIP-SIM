<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Заказ доставки сим-карты</title>
</head>
<body style="margin:0; padding:20px; font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background:#f2f4f8; box-sizing:border-box;">
    <div style="max-width:680px; margin:0 auto; background:white; border-radius:28px; box-shadow:0 12px 30px rgba(0,0,0,0.08); overflow:hidden; padding:0;">
        <!-- Header -->
        <div style="background:#e31e24; padding:28px 32px; text-align:center;">
            <h1 style="margin:0; color:white; font-weight:600; font-size:26px;">Заказ доставки сим-карты</h1>
            <p style="margin:10px 0 0; color:#ffcdce; font-size:15px;">Доставка до пункта выдачи Wildberries</p>
        </div>
        
        <!-- Форма -->
        <form id="orderForm" style="padding:30px 32px 40px; background:#fff;">
            <!-- 1. Номер телефона к кабинету WB -->
            <div style="margin-bottom:24px;">
                <label style="display:block; font-weight:600; font-size:14px; color:#1e2a32; margin-bottom:8px;">
                    📱 Номер телефона (кабинета Wildberries)
                </label>
                <input type="tel" id="wbPhone" required
                       placeholder="+7 999 123-45-67"
                       style="width:100%; padding:14px 16px; font-size:16px; border:1.5px solid #e2e8f0; border-radius:18px; box-sizing:border-box;">
                <div style="font-size:12px; color:#64748b; margin-top:6px;">Укажите номер, привязанный к вашему аккаунту WB</div>
            </div>

            <!-- 2. Адрес пункта выдачи WB -->
            <div style="margin-bottom:24px;">
                <label style="display:block; font-weight:600; font-size:14px; color:#1e2a32; margin-bottom:8px;">
                    📍 Адрес пункта выдачи WB (где удобно забрать)
                </label>
                <input type="text" id="pickupPoint" required
                       placeholder="г. Москва, ул. Примерная, д.10, ПВЗ WB"
                       style="width:100%; padding:14px 16px; font-size:16px; border:1.5px solid #e2e8f0; border-radius:18px; box-sizing:border-box;">
            </div>

            <!-- 3. Контактный номер телефона -->
            <div style="margin-bottom:24px;">
                <label style="display:block; font-weight:600; font-size:14px; color:#1e2a32; margin-bottom:8px;">
                    📞 Контактный номер телефона (для связи)
                </label>
                <input type="tel" id="contactPhone" required
                       placeholder="+7 900 123-45-67"
                       style="width:100%; padding:14px 16px; font-size:16px; border:1.5px solid #e2e8f0; border-radius:18px; box-sizing:border-box;">
            </div>

            <!-- 4. E-mail -->
            <div style="margin-bottom:24px;">
                <label style="display:block; font-weight:600; font-size:14px; color:#1e2a32; margin-bottom:8px;">
                    ✉️ Ваш E-mail (действующий)
                </label>
                <input type="email" id="email" required
                       placeholder="example@mail.ru"
                       style="width:100%; padding:14px 16px; font-size:16px; border:1.5px solid #e2e8f0; border-radius:18px; box-sizing:border-box;">
            </div>

            <!-- 5. Время платежа из чека (НОВОЕ ПОЛЕ) -->
            <div style="margin-bottom:28px;">
                <label style="display:block; font-weight:600; font-size:14px; color:#1e2a32; margin-bottom:8px;">
                    🕐 Время платежа из чека
                </label>
                <input type="text" id="paymentTime" required
                       placeholder="Например: 12.04.2026 15:34"
                       style="width:100%; padding:14px 16px; font-size:16px; border:1.5px solid #e2e8f0; border-radius:18px; box-sizing:border-box;">
                <div style="font-size:12px; color:#64748b; margin-top:6px;">Укажите дату и время из чека после оплаты</div>
            </div>

            <!-- Кнопка оплаты -->
            <div style="margin-bottom:28px;">
                <div style="background:#f8fafc; border-radius:24px; padding:12px 18px; border:1px solid #e9edf2; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;">
                    <span style="font-weight:500; color:#1e2a32;">💳 Оплата консультации (500₽)</span>
                    <a href="https://pro.selfwork.ru/kassa/konsultacii500" target="_blank" 
                       style="background:#e31e24; color:white; padding:10px 22px; border-radius:60px; text-decoration:none; font-weight:600; font-size:14px;">
                        Перейти к оплате ↗
                    </a>
                </div>
                <p style="font-size:13px; color:#4a5b6e; margin-top:10px;">Оплатите и укажите выше дату и время платежа из чека</p>
            </div>

            <!-- Кнопка Отправить -->
            <button type="submit" id="submitBtn" 
                    style="width:100%; background:#e31e24; border:none; padding:16px; font-size:18px; font-weight:700; color:white; border-radius:60px; cursor:pointer;">
                📩 Отправить заявку
            </button>
            <p style="text-align:center; font-size:12px; color:#8895a3; margin-top:20px;">Заявка придет на почту vip.simki@vk.com</p>
        </form>
    </div>

    <script>
        (function() {
            const form = document.getElementById('orderForm');
            
            function validatePhone(phone, fieldName) {
                const digits = phone.replace(/[\s\-\(\)\+]/g, '');
                if (digits.length < 10 || digits.length > 15) {
                    return `${fieldName} должен содержать от 10 до 15 цифр`;
                }
                return null;
            }
            
            form.addEventListener('submit', async function(event) {
                event.preventDefault();
                
                const wbPhone = document.getElementById('wbPhone').value.trim();
                const pickup = document.getElementById('pickupPoint').value.trim();
                const contactPhone = document.getElementById('contactPhone').value.trim();
                const email = document.getElementById('email').value.trim();
                const paymentTime = document.getElementById('paymentTime').value.trim();
                
                if (!wbPhone) { alert('Укажите номер телефона кабинета Wildberries'); return; }
                if (!pickup) { alert('Укажите адрес пункта выдачи Wildberries'); return; }
                if (!contactPhone) { alert('Укажите контактный номер телефона'); return; }
                if (!email || !email.includes('@')) { alert('Введите корректный e-mail адрес'); return; }
                if (!paymentTime) { alert('Укажите время платежа из чека'); return; }
                
                const phoneError1 = validatePhone(wbPhone, 'Телефон кабинета WB');
                if (phoneError1) { alert(phoneError1); return; }
                const phoneError2 = validatePhone(contactPhone, 'Контактный телефон');
                if (phoneError2) { alert(phoneError2); return; }
                
                const submitBtn = document.getElementById('submitBtn');
                const originalText = submitBtn.innerHTML;
                submitBtn.innerHTML = '⏳ Отправка...';
                submitBtn.disabled = true;
                
                // Формируем данные для отправки
                const formData = new FormData();
                formData.append('wb_phone', wbPhone);
                formData.append('pickup_address', pickup);
                formData.append('contact_phone', contactPhone);
                formData.append('email', email);
                formData.append('payment_time', paymentTime);
                formData.append('_subject', '📦 Новая заявка на доставку сим-карты WB');
                formData.append('_captcha', 'false');
                formData.append('_template', 'table');
                
                const message = `
                    🔹 Номер кабинета WB: ${wbPhone}
                    🔹 Адрес ПВЗ WB: ${pickup}
                    🔹 Контактный телефон: ${contactPhone}
                    🔹 E-mail клиента: ${email}
                    🔹 Время платежа из чека: ${paymentTime}
                `;
                formData.append('message', message);
                formData.append('_replyto', email);
                
                try {
                    const response = await fetch('https://formsubmit.co/ajax/vip.simki@vk.com', {
                        method: 'POST',
                        body: formData,
                        headers: { 'Accept': 'application/json' }
                    });
                    
                    if (response.ok) {
                        alert('✅ Заявка успешно отправлена! Менеджер свяжется с вами, если будет необходимость уточнить детали');
                        form.reset();
                    } else {
                        throw new Error('Ошибка отправки');
                    }
                } catch (error) {
                    alert('❌ Ошибка: Не удалось отправить заявку. Пожалуйста, попробуйте позже.');
                } finally {
                    submitBtn.innerHTML = originalText;
                    submitBtn.disabled = false;
                }
            });
        })();
    </script>
</body>
</html>
